name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # the release workflow runs every check before it publishes
    inputs:
      e2e:
        description: Run the headless browser smoke test
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"  # Mondays: new vulnerabilities in pinned dependencies and the base image show up here
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the headless browser smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by full commit SHA (DECISIONS.md D-055); Dependabot proposes the updates.
jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      PY: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the privacy scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff) and type check (mypy)
        run: make lint
      - name: Shell scripts (shellcheck, preinstalled on the runner)
        run: shellcheck scripts/upgrade.sh
      - name: Tests with coverage (core must stay at 90% or more)
        run: make cov
      - name: Dependency vulnerabilities (pip-audit, installed and pinned)
        run: make audit
      - name: Privacy scan (generic patterns; the private deny-list never leaves the maintainer's machine)
        run: python scripts/privacy_scan.py --repo --history

  image:
    name: Image (amd64 + arm64), container tests, vulnerability scan
    runs-on: ubuntu-latest
    needs: test
    env:
      # The upgrade test starts from the last release; set this to the new tag after each release.
      # Empty until the first release of this repository: the container tests then skip the upgrade step.
      PREVIOUS_REF: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the upgrade test builds the image of an earlier commit
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each platform is built once and loaded into the local image store; the builds share the cache.
      - name: Build linux/amd64 (loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hearthfund:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build linux/arm64 under QEMU (loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: hearthfund:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the previous image for the upgrade test
        if: env.PREVIOUS_REF != ''
        run: make image-previous PREVIOUS_REF=$PREVIOUS_REF
      - name: Container tests, amd64 (fresh start, restart, upgrade, hardening)
        run: |
          if [ -n "$PREVIOUS_REF" ]; then
            python3 scripts/container_test.py --image hearthfund:latest --previous hearthfund:previous
          else
            python3 scripts/container_test.py --image hearthfund:latest --no-upgrade
          fi
      - name: Container tests, arm64 under QEMU (the upgrade step is skipped on purpose)
        env:
          HBUDGET_CT_TIMEOUT: "300"
        run: python3 scripts/container_test.py --image hearthfund:arm64 --no-upgrade --port 18180
      # Scans the image's final, merged filesystem (what a running container sees). `trivy image` reads each layer
      # and reported pip's vendored packages from the base image's Python layer although the runtime stage deletes
      # pip in a later layer; the rootfs scan still covers the Debian packages (dpkg status) and the app's venv.
      - name: Vulnerability scan (trivy; fails on HIGH or CRITICAL with a fix available)
        run: |
          rootfs="$RUNNER_TEMP/rootfs" && mkdir -p "$rootfs"
          cid=$(docker create hearthfund:latest)
          docker export "$cid" | tar -x -C "$rootfs" --no-same-owner --no-same-permissions
          docker rm "$cid"
          trivy=aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
          docker run --rm -v "$rootfs:/rootfs:ro" -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$trivy" rootfs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore /rootfs

  e2e:
    # every release (release.yml asks for it), the weekly run, or by hand; not on pull requests (it needs a browser)
    name: Browser smoke test (releases, weekly, manual)
    if: inputs.e2e || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install with the e2e extra and a headless browser
        run: |
          python -m pip install -e '.[dev,e2e]'
          python -m playwright install --with-deps chromium-headless-shell
      - name: Run
        env:
          HBUDGET_E2E: "1"
          PYTHONPATH: src
        run: python -m pytest tests/e2e -q
