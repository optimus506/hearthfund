{% extends "base.html" %}
{% block content %}
<section class="card" aria-labelledby="h-n">
  <h2 id="h-n">Notes</h2>
  <div class="notes-view" id="notesView"></div>
  <form id="notesForm" class="field">
    <label for="notesText">Edit</label>
    <textarea id="notesText" maxlength="100000"></textarea>
    <div><button class="btn primary" type="submit">Save notes</button></div>
  </form>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="{{ static }}/js/notes.js"></script>{% endblock %}
