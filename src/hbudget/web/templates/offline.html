<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#36609c">
<title>Offline · Hearthfund</title>
<link rel="stylesheet" href="{{ static }}/css/app.css">
<link rel="icon" href="{{ static }}/icon.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap">
  <main id="main" class="main">
    <section class="card" aria-labelledby="h-off">
      <h1 id="h-off">You're offline</h1>
      <p>The budget lives on your own server, and it can't be reached right now. Check that you're on the home
        network (or the VPN) and try again.</p>
      <p class="muted small">Nothing from the budget is stored on this device, so there is nothing to show
        without the server.</p>
      <p><a class="btn primary" href="/">Try again</a></p>
    </section>
  </main>
</div>
</body>
</html>
